    <script>
      // Prevent external browser extension errors (e.g. CRX emulator / content script message timeouts) from leaking into window
      window.addEventListener('error', function(event) {
        var msg = (event.message || '') + (event.filename || '') + ((event.error && event.error.stack) || '');
        if (
          msg.includes('chrome-extension://') ||
          msg.includes('chrome: call method') ||
          msg.includes('bekkpoinfafbjglppgdobfdeckghdhlo')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack)) || String(reason || '');
        if (
          msg.includes('chrome-extension://') ||
          msg.includes('chrome: call method') ||
          msg.includes('bekkpoinfafbjglppgdobfdeckghdhlo')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>

  </body>
